<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- IT Command Center: installable shell. It opens the Apps Script web app full screen. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IT Command Center</title>
  <meta name="theme-color" content="#0b1120">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IT Center">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #0b1120; color: #e6ebf5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #0b1120; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0b1120; z-index: 2; transition: opacity .3s; }
    #splash img { width: 84px; height: 84px; border-radius: 20px; }
    #splash .t { font-size: 17px; font-weight: 600; }
    #splash .s { font-size: 13px; color: #8a97b0; text-align: center; max-width: 260px; line-height: 1.45; }
    .bar { width: 120px; height: 3px; border-radius: 2px; background: #1e2a40; overflow: hidden; }
    .bar i { display: block; width: 40%; height: 100%; background: #74a7ff; border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    button { font: inherit; border-radius: 10px; border: 0; padding: 10px 18px; background: #2f6fe4; color: #fff; font-weight: 600; cursor: pointer; }
    #tip { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 3; display: none; align-items: center; gap: 12px;
           padding: 12px 14px; border-radius: 14px; background: #111a2e; border: 1px solid #2a3a55; box-shadow: 0 8px 28px rgba(0,0,0,.4); font-size: 13.5px; }
    #tip img { width: 36px; height: 36px; border-radius: 9px; }
    #tip .grow { flex: 1; line-height: 1.35; }
    #tip .x { background: none; color: #8a97b0; padding: 6px; font-size: 18px; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icon-192.png" alt="">
    <div class="t">IT Command Center</div>
    <div class="bar" id="bar"><i></i></div>
    <div class="s" id="msg"></div>
  </div>
  <div id="tip"><img src="icon-192.png" alt=""><div class="grow" id="tipText"></div><button id="tipBtn" style="display:none">Install</button><button class="x" id="tipX" aria-label="Close">✕</button></div>

  <script>
    // >>> Paste your web app URL here (Deploy > Manage deployments > Web app URL, ends with /exec) <<<
    const APP_URL = 'https://script.google.com/macros/s/AKfycbwQ4J-YqJzLc6l2mbXJlLBCGj3KnvcDH4uBIZX-Ecm98UjCUSaf931HiQweO3mFus-4/exec';

    const $ = id => document.getElementById(id);
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

    function showMsg(text, retry) {
      $('bar').style.display = 'none';
      $('msg').innerHTML = text + (retry ? '<div style="margin-top:14px"><button onclick="location.reload()">Try again</button></div>' : '');
    }

    function start() {
      if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL)) { showMsg('Setup needed: paste the web app URL into index.html.'); return; }
      if (!navigator.onLine) { showMsg('No internet connection.', true); return; }
      const f = document.createElement('iframe');
      f.src = APP_URL; f.title = 'IT Command Center';
      f.allow = 'clipboard-write';
      f.onload = () => { $('splash').style.opacity = 0; setTimeout(() => $('splash').remove(), 300); };
      document.body.appendChild(f);
      // Slow network: keep the splash but say so
      setTimeout(() => { if ($('splash')) $('msg').textContent = 'Still loading. Slow connection?'; }, 12000);
    }
    addEventListener('offline', () => { if (!$('splash')) { document.body.insertAdjacentHTML('beforeend', '<div id="splash">' + '<img src="icon-192.png" alt=""><div class="t">No internet connection</div><div class="s">Your work is not lost. Reconnect and try again.</div><button onclick="location.reload()">Try again</button></div>'); } });
    start();

    // Offline support for this page (icon, splash, "no internet" message)
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

    // Install hint, only in the browser (not once installed)
    if (!standalone && !localStorage.getItem('gv_tip_off')) {
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
      let deferred = null;
      const show = text => { $('tipText').innerHTML = text; $('tip').style.display = 'flex'; };
      addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('tipBtn').style.display = 'block'; show('<b>Install IT Command Center</b><br>Opens full screen from your home screen.'); });
      $('tipBtn').onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $('tip').style.display = 'none'; };
      if (ios) setTimeout(() => show('<b>Install on iPhone</b><br>Tap Share <b>⬆︎</b> then <b>Add to Home Screen</b>.'), 2500);
      $('tipX').onclick = () => { $('tip').style.display = 'none'; try { localStorage.setItem('gv_tip_off', '1'); } catch (e) {} };
    }
  </script>
</body>
</html>
